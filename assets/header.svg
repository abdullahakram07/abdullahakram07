<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Abdullah Akram — AI systems, thoughtfully engineered</title>
  <desc id="d">Animated header. A line of five nodes (retrieve, approve, evaluate, route, defend) with a signal travelling along it and a feedback loop back to the start.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1B222C" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5A524" stop-opacity="0"/>
      <stop offset=".5" stop-color="#F5A524" stop-opacity=".9"/>
      <stop offset="1" stop-color="#F5A524" stop-opacity="0"/>
    </linearGradient>
    <path id="main" d="M740 150 L1100 150"/>
  </defs>
  <style>
    .sans{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
    .rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
    .d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .cursor{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .flow{stroke-dasharray:6 8;animation:dash 1.6s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-28}}
    .scan{animation:scan 5s ease-in-out infinite}
    @keyframes scan{0%{transform:translateX(-200px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(1200px);opacity:0}}
    @media (prefers-reduced-motion:reduce){.rise,.cursor,.flow,.scan{animation:none}}
  </style>

  <rect width="1200" height="300" fill="#0D1117"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect class="scan" x="0" y="0" width="200" height="300" fill="url(#glow)" opacity=".08"/>
  <rect x="0" y="296" width="1200" height="4" fill="#F5A524"/>

  <g class="rise">
    <text class="mono" x="60" y="82" font-size="13" letter-spacing="3" fill="#8B949E">PORTFOLIO / AI SYSTEMS</text>
  </g>
  <g class="rise d1">
    <text class="sans" x="58" y="150" font-size="60" font-weight="700" fill="#F0F6FC" letter-spacing="-1.5">Abdullah Akram</text>
  </g>
  <g class="rise d2">
    <text class="sans" x="60" y="192" font-size="24" fill="#C9D1D9">AI systems, thoughtfully engineered</text>
  </g>
  <g class="rise d3">
    <text class="mono" x="60" y="236" font-size="15" fill="#F5A524">Applied AI · Python · Reliable systems</text>
    <rect class="cursor" x="428" y="223" width="9" height="17" fill="#F5A524"/>
  </g>

  <!-- feedback loop -->
  <path class="flow" d="M1100 138 C1100 60 740 60 740 138" fill="none" stroke="#3B4452" stroke-width="1.5"/>
  <text class="mono" x="920" y="58" font-size="11" text-anchor="middle" fill="#8B949E" letter-spacing="2">FEEDBACK</text>

  <!-- main line -->
  <use href="#main" stroke="#3B4452" stroke-width="2" fill="none"/>
  <use href="#main" class="flow" stroke="#F5A524" stroke-width="2" fill="none" opacity=".7"/>
  <circle r="5" fill="#F5A524">
    <animateMotion dur="4s" repeatCount="indefinite" path="M740 150 L1100 150"/>
  </circle>

  <!-- nodes -->
  <g fill="#0D1117" stroke="#F5A524" stroke-width="2">
    <circle cx="740" cy="150" r="10"/>
    <circle cx="830" cy="150" r="10"/>
    <circle cx="920" cy="150" r="10"/>
    <circle cx="1010" cy="150" r="10"/>
    <circle cx="1100" cy="150" r="10"/>
  </g>
  <g fill="none" stroke="#F5A524" stroke-width="1.5">
    <circle cx="740" cy="150" r="10"><animate attributeName="r" values="10;24" dur="4s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="4s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="150" r="10"><animate attributeName="r" values="10;24" dur="4s" begin=".8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="4s" begin=".8s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="150" r="10"><animate attributeName="r" values="10;24" dur="4s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="4s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="150" r="10"><animate attributeName="r" values="10;24" dur="4s" begin="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="4s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="150" r="10"><animate attributeName="r" values="10;24" dur="4s" begin="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="4s" begin="3.2s" repeatCount="indefinite"/></circle>
  </g>
  <g class="mono" font-size="12" text-anchor="middle" fill="#C9D1D9">
    <text x="740" y="190">retrieve</text>
    <text x="830" y="190">approve</text>
    <text x="920" y="190">evaluate</text>
    <text x="1010" y="190">route</text>
    <text x="1100" y="190">defend</text>
  </g>
  <g class="mono" font-size="10" text-anchor="middle" fill="#6E7681" letter-spacing="1">
    <text x="740" y="208">grounded</text>
    <text x="830" y="208">bounded</text>
    <text x="920" y="208">measured</text>
    <text x="1010" y="208">gateway</text>
    <text x="1100" y="208">trusted</text>
  </g>
</svg>
